[package]
name = "bimcraft-cli"
description = "BIMCraft from the command line: scripts, conversion, and an MCP server for agents"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# Reads Revit's .rvt and .rfa files. That code is ported from rvt-rs and is Apache-2.0 only (docs/rvt-provenance.md),
# so a build without it, which keeps the repository's MIT OR Apache-2.0, is `--no-default-features`.
# Reads a DWG, Autodesk's own format, by turning it into DXF. That goes through `acadrust`, which is MPL-2.0 (NOTICE):
# used unmodified it leaves this repository's MIT OR Apache-2.0 alone, and a build without it is `--no-default-features`.
default = ["rvt", "dwg"]
rvt = ["dep:bimcraft-rvt"]
dwg = ["dep:bimcraft-dwg"]

[dependencies]
bimcraft-core = { workspace = true }
bimcraft-rvt = { workspace = true, optional = true }
bimcraft-dwg = { workspace = true, optional = true }
serde_json = { workspace = true }

[dev-dependencies]
# Synthetic Revit-shaped files for the tests of `info`.
bimcraft-rvt = { workspace = true, features = ["testing"] }
